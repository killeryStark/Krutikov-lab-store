version: "3.7"

services:
  fixer:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -u
        {
          echo "--- readlink /hostroot/Apps"
          readlink -f /hostroot/Apps || true
          echo "--- ls /hostroot/Apps"
          ls -la /hostroot/Apps 2>&1
          echo "--- ls Apps/<id>"
          ls -la /hostroot/Apps/krutikov-lab-vless-proxy 2>&1
          echo "--- ls app-data/<id>"
          ls -la /hostroot/home/umbrel/umbrel/app-data/krutikov-lab-vless-proxy 2>&1
          echo "--- mounts mentioning Apps"
          grep -i 'Apps' /proc/self/mountinfo || true
          echo "--- mounts mentioning app-data"
          grep -i 'app-data' /proc/self/mountinfo || true
        } > /data/probe2.txt 2>&1
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /:/hostroot:ro
