version: "3.7"

services:
  fixer:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -eu
        {
          echo "id: $(id)"
          echo "--- /hostroot ---"
          ls -la /hostroot 2>&1 | head -30
          echo "--- find app dirs ---"
          find /hostroot -maxdepth 5 -type d -name 'krutikov-lab-vless-proxy' 2>/dev/null
        } > /data/probe.txt
        echo ok >> /data/probe.txt
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /:/hostroot:ro
