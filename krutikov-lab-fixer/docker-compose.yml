version: "3.7"

services:
  fixer:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -u
        T=/hostroot/home/umbrel/umbrel/app-data/krutikov-lab-vless-proxy
        rm -f "$T/data/test.txt" "$T/app/test.txt"
        { echo "--- code dirs"; ls -la "$T/data/code" 2>&1; echo "--- xray"; "$T/data/bin/xray" version 2>&1 | head -2; echo "--- compose tag"; grep CODE_TAG "$T/docker-compose.yml"; echo "--- ver"; grep ^version: "$T/umbrel-app.yml"; } > /data/cleanup.txt 2>&1
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /:/hostroot
