version: "3.7"

services:
  fixer:
    image: alpine:3.20
    restart: "no"
    environment:
      - DC_
      - MAN_
    command:
      - sh
      - -c
      - |
        set -eu
        echo "marker-$(date +%s)" > /host/MCP-MARKER.txt
        echo "$DC_B64" | base64 -d > /host/docker-compose.yml
        echo "$MAN_B64" | base64 -d > /host/umbrel-app.yml
        {
          echo "--- ls /host"
          ls -la /host
          echo "--- compose head"
          head -3 /host/docker-compose.yml
          echo "--- tag"
          grep 'CODE_TAG=vless' /host/docker-compose.yml || true
          echo "--- manifest ver"
          grep '^version:' /host/umbrel-app.yml || true
        } > /data/after.txt
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /Apps/krutikov-lab-vless-proxy:/host
