version: "3.7"

services:
  app_proxy:
    environment:
      # Формат: <app-id>_<service>_1
      APP_HOST: krutikov-lab-vless-proxy_web_1
      APP_PORT: 3001
      # Авторизации нет по замыслу: панель и прокси живут в локальной сети.
      # Второй слой логина Umbrel выключен, иначе он закрыл бы панель.
      PROXY_AUTH_ADD: "false"

  web:
    # Официальный multi-arch образ Node.js (digest зафиксирован). Код панели
    # не монтируется из папки приложения: при первом старте он скачивается
    # из тега store (CODE_TAG) в /data/code, поэтому обычное обновление
    # приложения в Umbrel подхватывает новый код без переустановки.
    # Доллары удвоены: docker compose интерполирует $ сам, до shell.
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    command:
      - sh
      - -c
      - |
        set -eu
        V="$${CODE_TAG:?CODE_TAG is not set}"
        D="/data/code/$$V"
        if [ ! -f "$$D/.ready" ]; then
          echo "[bootstrap] загружаю код $$V"
          rm -rf "$$D"
          mkdir -p "$$D"
          wget -qO /tmp/code.tgz "https://codeload.github.com/killeryStark/Krutikov-lab-store/tar.gz/refs/tags/$$V" || exit 1
          tar xzf /tmp/code.tgz -C "$$D" --strip-components=2 "Krutikov-lab-store-$$V/krutikov-lab-vless-proxy/app" || exit 1
          rm -f /tmp/code.tgz
          touch "$$D/.ready"
        fi
        export APP_DIR="$$D/app"
        exec sh "$$D/app/start.sh"
    # Прокси публикуется прямо на хост: Node-мультиплексор слушает 1080
    # и по первому байту направляет в SOCKS5 или HTTP-инбаунд Xray.
    # Снаружи это 20180. Панель (3001) наружу не торчит: к ней ходит
    # только app_proxy Umbrel на 20131.
    ports:
      - "20180:1080"
    environment:
      - WEB_PORT=3001
      - PROXY_PORT=1080
      # Порт, который панель показывает клиентам в локальной сети.
      - PUBLIC_PROXY_PORT=20180
      - DATA_DIR=/data
      - XRAY_VERSION=26.10.31
      - CODE_TAG=vless-1.1.2
    volumes:
      # state.json со ссылкой, xray.json, скачанный бинарник xray и код панели.
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
